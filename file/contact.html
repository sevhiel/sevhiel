<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/hi.css">

</head>
<style>
  .footer {
    background-color: black;
    color: white;
    padding: 10px 0;
    text-align: center;
}

.footer a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
}

.navbar-custom {
    background-color: #6f42c1;
    /* Purple background */
}

.search-box {
    border-radius: 20px;
    background-color: rgba(255, 255, 255, 0.2);
    color: white;
    border: none;
    padding: 5px 10px;
}

.search-box::placeholder {
    color: white;
    opacity: 0.8;
}

.search-container {
    position: relative;
}

.search-container span {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    background-color: #543699;
    padding: 2px 6px;
    border-radius: 5px;
    color: white;
}

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Oriya:wght@400..700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Noto Serif Oriya", serif;

}

body {
    background: url(sunset.jpg)no-repeat center center / cover;
}

nav {
    padding: 0 50px;
    width: 100%;
}

.navbar-one {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.left {
    display: flex;
}

.right {
    display: flex;
}

.flex {
    display: flex;

    align-items: center;
    list-style: none;
}

.flex a:hover {
    color: rgb(197, 21, 21);
    transition: 0.4s;
    text-shadow: 0px 0px 9px;
}

.flex a::after {
    content: "";
    width: 0%;
    height: 5px;
    display: flex;
    background-color: rgb(2, 154, 241);
    align-items: center;
    transition: 0.5s;
}

.flex a:hover::after {
    width: 100%;
}

.flex a::before {
    color: blue;

}

.navbar-one {
    background: #000;
    color: white;
    height: 40px;
    cursor: pointer;
}

.left>div+div {
    margin-left: 40px;
}

.right>div {
    margin-left: 40px;
}

.left>div:hover,
.left>div:hover {
    color: green;
    transition: all 0.5s;
}

.right>div:hover,
.right>div:hover {
    color: green;
    transition: all 0.5s;
}
</style>

<body>
  <nav class="navbar-one">
    <div class="left">
      <div class="email">
        <i class="fa fa-nevelope"></i>
        <span>digitaluniversityofcambodia@gmail.com</span>
      </div>
      <div class="call">
        <i class="fa fa-phone-alt"></i>
        <span>( +855 ) 0979361072</span>
      </div>
    </div>
    <div class="right">
      <div class="twitter">
        <i class="fab fa-twitter"></i>
        <span>Twitter</span>
      </div>
      <div class="facebook">
        <i class="fab fa-facebook"></i>
        <span>Facebook</span>
      </div>
    </div>
  </nav>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom ">
    <div class="container mt-2">
      <a class="navbar-brand" href="#">
        <img src="../image/image copy.png" width="30" height="30"
          alt="Bootstrap">
        DUC
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-3">
          <li class="nav-item"><a class="nav-link text-white" href="../index.html">HOME</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="../file/about.html">ABOUT</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="../file/service.html">SERVICE</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="../file/contact.html">CONTACT</a></li>
        </ul>
        <form class="d-flex ms-auto search-container">
          <input class="form-control search-box" type="search" placeholder="Search">
          <span>submit</span>
        </form>
      </div>
    </div>
  </nav>
  


<section id="contact" class="py-5" style="color: greenyellow;">
    <div class="container">
        <div class="card">
            <h2 class="text-center mb-5">Contact Us</h2>
            <div class="row">
                <div class="col-md-6 mx-auto">
                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>
                </div>
            </div>

        </div>
       
    </div>
</section>


<footer class="bg-dark text-white text-center py-3">
    <div class="container">

    </div>
</footer>

</body>

</html>
